name: Release APK

on:
  workflow_dispatch:

jobs:
  build_release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Same signing key on every build, so each APK installs as an update over the previous one.
      # The key lives in the repo secret DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions).
      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret DEBUG_KEYSTORE_BASE64 (o esta vacio). Sin el, el APK no se puede instalar como actualizacion. Revisa Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error::El secret DEBUG_KEYSTORE_BASE64 no es una llave valida (alias androiddebugkey, clave android)."; exit 1; }
          echo "Using persistent signing key from secret."
          KS_SHA=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Llave del secret (SHA-256): $KS_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "KS_SHA=$KS_SHA" >> "$GITHUB_ENV"
          echo "GRACIE_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          # Maven a veces responde 429 (demasiadas peticiones). Se reintenta hasta 3 veces.
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-configuration-cache --console=plain --warning-mode summary && exit 0
            echo "::warning::Intento $i falló. Reintentando en 60 s..."
            sleep 60
          done
          exit 1

      # Firma el APK con la llave del secret, pase lo que pase en Gradle.
      - name: Sign APK with secret key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          for f in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" sign \
              --ks ~/.android/debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              "$f"
            echo "Firmado con la llave del secret: $f"
          done

      - name: Show APK signing fingerprint
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          for f in app/build/outputs/apk/release/*.apk; do
            echo "APK compilado (SHA-256):" | tee -a "$GITHUB_STEP_SUMMARY"
            "$APKSIGNER" verify --print-certs "$f" | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gracies-explorer-release
          path: app/build/outputs/apk/release/*.apk

      # Si la firma del APK no es la del secret, el job se pone en rojo (el APK ya se subió arriba).
      - name: Verify signature matches secret
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          for f in app/build/outputs/apk/release/*.apk; do
            APK_SHA=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 "SHA-256" | awk '{print $NF}')
            if [ "$APK_SHA" != "$KS_SHA" ]; then
              echo "::error::La firma del APK ($APK_SHA) NO es la del secret ($KS_SHA)."
              exit 1
            fi
            echo "Firma correcta: $APK_SHA"
          done
